<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Harbor 系统总览</title>
  <desc id="desc">Harbor GUI 连接本机或远端 harbor_core，由 Core 发现 YAML、管理任务和保存日志。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1728"/><stop offset="1" stop-color="#14243a"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1677ff"/><stop offset="1" stop-color="#21c7a8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#55a7ff"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="190" fill="#1677ff" opacity=".08"/><circle cx="120" cy="620" r="220" fill="#21c7a8" opacity=".06"/>
  <text x="64" y="72" fill="#fff" font-size="30" font-family="system-ui,sans-serif" font-weight="700">Harbor · 统一的机器人任务运行入口</text>
  <text x="64" y="108" fill="#94a9c3" font-size="17" font-family="system-ui,sans-serif">一个 GUI，一台机器一个 Core，Task UUID 贯穿所有 Workspace</text>

  <g filter="url(#shadow)">
    <rect x="64" y="170" width="280" height="370" rx="22" fill="#17283f" stroke="#31506f"/>
    <rect x="88" y="194" width="232" height="58" rx="14" fill="url(#brand)"/>
    <text x="204" y="231" text-anchor="middle" fill="#fff" font-size="22" font-family="system-ui,sans-serif" font-weight="700">Harbor GUI</text>
    <g font-family="system-ui,sans-serif" font-size="17" fill="#dbe9f8">
      <rect x="88" y="284" width="232" height="58" rx="12" fill="#203754"/><text x="112" y="320">Workspace 与路径</text>
      <rect x="88" y="358" width="232" height="58" rx="12" fill="#203754"/><text x="112" y="394">任务、状态与日志</text>
      <rect x="88" y="432" width="232" height="58" rx="12" fill="#203754"/><text x="112" y="468">Web Panel</text>
    </g>
  </g>

  <path d="M344 355h118" stroke="#55a7ff" stroke-width="4" marker-end="url(#arrow)"/><text x="402" y="340" text-anchor="middle" fill="#8fc5ff" font-size="15" font-family="system-ui,sans-serif">HTTP API v1</text>

  <g filter="url(#shadow)">
    <rect x="474" y="150" width="360" height="410" rx="22" fill="#17283f" stroke="#31506f"/>
    <text x="654" y="204" text-anchor="middle" fill="#fff" font-size="24" font-family="system-ui,sans-serif" font-weight="700">harbor_core</text>
    <text x="654" y="232" text-anchor="middle" fill="#8fc5ff" font-size="15" font-family="system-ui,sans-serif">单机单实例 · 端口 29385</text>
    <g font-family="system-ui,sans-serif" font-size="16" fill="#dbe9f8">
      <rect x="506" y="264" width="136" height="70" rx="12" fill="#203754"/><text x="574" y="294" text-anchor="middle">YAML</text><text x="574" y="316" text-anchor="middle" fill="#94a9c3" font-size="13">发现与校验</text>
      <rect x="666" y="264" width="136" height="70" rx="12" fill="#203754"/><text x="734" y="294" text-anchor="middle">UUID</text><text x="734" y="316" text-anchor="middle" fill="#94a9c3" font-size="13">冲突与身份</text>
      <rect x="506" y="354" width="136" height="70" rx="12" fill="#203754"/><text x="574" y="384" text-anchor="middle">Process</text><text x="574" y="406" text-anchor="middle" fill="#94a9c3" font-size="13">启动与停止</text>
      <rect x="666" y="354" width="136" height="70" rx="12" fill="#203754"/><text x="734" y="384" text-anchor="middle">Runtime</text><text x="734" y="406" text-anchor="middle" fill="#94a9c3" font-size="13">实时状态</text>
      <rect x="506" y="444" width="296" height="70" rx="12" fill="#203754"/><text x="654" y="474" text-anchor="middle">Workspace Logs</text><text x="654" y="496" text-anchor="middle" fill="#94a9c3" font-size="13">实时输出与历史记录</text>
    </g>
  </g>

  <path d="M834 290h116" stroke="#55a7ff" stroke-width="4" marker-end="url(#arrow)"/><path d="M834 455h116" stroke="#55a7ff" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="system-ui,sans-serif">
    <rect x="962" y="200" width="174" height="180" rx="20" fill="#17283f" stroke="#31506f"/>
    <text x="1049" y="246" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">项目配置</text>
    <rect x="986" y="270" width="126" height="40" rx="10" fill="#203754"/><text x="1049" y="296" text-anchor="middle" fill="#dbe9f8" font-size="15">Task YAML</text>
    <rect x="986" y="320" width="126" height="40" rx="10" fill="#203754"/><text x="1049" y="346" text-anchor="middle" fill="#dbe9f8" font-size="15">Group YAML</text>
    <rect x="962" y="410" width="174" height="130" rx="20" fill="#17283f" stroke="#31506f"/>
    <text x="1049" y="456" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">任务进程</text>
    <text x="1049" y="488" text-anchor="middle" fill="#94a9c3" font-size="14">ROS 2 · Web · Script</text>
    <text x="1049" y="512" text-anchor="middle" fill="#94a9c3" font-size="14">本地或远端机器</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15"><rect x="64" y="598" width="1072" height="42" rx="12" fill="#10243b" stroke="#294a69"/><text x="600" y="625" text-anchor="middle" fill="#9fc4e8">Workspace 隔离搜索路径与日志；UUID 让实时运行状态跨 Workspace 共享</text></g>
</svg>
