<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Harbor Task 单实例生命周期</title>
  <desc id="desc">一个 Task 在停止和运行之间切换。任务运行时再次启动不会创建第二个实例，重启会替换当前实例。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15171c"/>
      <stop offset="1" stop-color="#1b2029"/>
    </linearGradient>
    <linearGradient id="running" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173a34"/>
      <stop offset="1" stop-color="#122d31"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5aa9ff"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8793a6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#35c9a5"/>
    </marker>
  </defs>

  <rect width="1100" height="500" rx="24" fill="url(#background)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="52" y="62" fill="#f3f6fb" font-size="28" font-weight="700">一个 Task，始终只有一个实例</text>
    <text x="52" y="94" fill="#98a3b3" font-size="16">Start、Stop 和 Restart 只改变这一个实例的状态</text>

    <g transform="translate(90 158)">
      <rect width="330" height="176" rx="20" fill="#20242c" stroke="#3a414e" stroke-width="2"/>
      <circle cx="54" cy="54" r="18" fill="#2d333e" stroke="#7d8796" stroke-width="2"/>
      <rect x="48" y="48" width="12" height="12" rx="2" fill="#aab2bf"/>
      <text x="88" y="61" fill="#f3f6fb" font-size="24" font-weight="700">Stopped</text>
      <text x="34" y="112" fill="#c2c8d2" font-size="16">没有运行实例</text>
      <text x="34" y="141" fill="#8d98a8" font-size="14">已保存配置，随时可以启动</text>
    </g>

    <g transform="translate(680 158)">
      <rect width="330" height="176" rx="20" fill="url(#running)" stroke="#35c9a5" stroke-width="2"/>
      <circle cx="54" cy="54" r="18" fill="#174c40" stroke="#45d8b4" stroke-width="2"/>
      <path d="M48 44L64 54L48 64Z" fill="#70e5c7"/>
      <text x="88" y="61" fill="#f3f6fb" font-size="24" font-weight="700">Running</text>
      <text x="34" y="112" fill="#c8f4e9" font-size="16">恰好一个运行实例</text>
      <text x="34" y="141" fill="#83cbbb" font-size="14">状态与日志对所有 Workspace 可见</text>
    </g>

    <path d="M420 205H680" fill="none" stroke="#5aa9ff" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="500" y="174" width="100" height="34" rx="17" fill="#1d3550" stroke="#386d9f"/>
    <text x="550" y="197" text-anchor="middle" fill="#9ed0ff" font-size="15" font-weight="600">Start</text>

    <path d="M680 290H420" fill="none" stroke="#8793a6" stroke-width="4" marker-end="url(#arrow-muted)"/>
    <rect x="500" y="286" width="100" height="34" rx="17" fill="#292e37" stroke="#4b5361"/>
    <text x="550" y="309" text-anchor="middle" fill="#c5cbd5" font-size="15" font-weight="600">Stop</text>

    <path d="M846 158C846 112 958 112 958 158" fill="none" stroke="#35c9a5" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="902" y="116" text-anchor="middle" fill="#75ddc4" font-size="14" font-weight="600">Restart：替换当前实例</text>

    <g transform="translate(250 388)">
      <rect width="600" height="64" rx="16" fill="#20242c" stroke="#3a414e"/>
      <circle cx="34" cy="32" r="12" fill="#45262a" stroke="#ef6b74"/>
      <path d="M29 27L39 37M39 27L29 37" stroke="#ff8991" stroke-width="2.5" stroke-linecap="round"/>
      <text x="58" y="27" fill="#e9edf3" font-size="15" font-weight="600">Running 时再次 Start</text>
      <text x="58" y="47" fill="#9da7b6" font-size="14">Harbor 拒绝重复启动，不会创建第二个实例</text>
    </g>
  </g>
</svg>
