<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Harbor Task 生命周期</title><desc id="desc">Task 从 YAML 发现、UUID 校验，到启动、运行、停止和日志保存的过程。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1728"/><stop offset="1" stop-color="#14243a"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#55a7ff"/></marker></defs>
  <rect width="1100" height="520" rx="26" fill="url(#bg)"/><text x="50" y="64" fill="#fff" font-size="28" font-weight="700" font-family="system-ui,sans-serif">Task 生命周期</text><text x="50" y="96" fill="#94a9c3" font-size="16" font-family="system-ui,sans-serif">UUID 是运行身份，Workspace 只决定发现范围和日志位置</text>
  <g font-family="system-ui,sans-serif">
    <g transform="translate(70 190)"><circle r="68" fill="#17283f" stroke="#31506f" stroke-width="2"/><text y="-10" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">YAML</text><text y="18" text-anchor="middle" fill="#94a9c3" font-size="14">发现</text></g>
    <path d="M138 190h82" stroke="#55a7ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(290 190)"><circle r="68" fill="#17283f" stroke="#31506f" stroke-width="2"/><text y="-10" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">UUID</text><text y="18" text-anchor="middle" fill="#94a9c3" font-size="14">生成 / 校验</text></g>
    <path d="M358 190h82" stroke="#55a7ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(510 190)"><circle r="68" fill="#17304a" stroke="#1677ff" stroke-width="2"/><text y="-10" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">Start</text><text y="18" text-anchor="middle" fill="#8fc5ff" font-size="14">环境合并</text></g>
    <path d="M578 190h82" stroke="#55a7ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(730 190)"><circle r="68" fill="#163a3b" stroke="#21c7a8" stroke-width="2"/><text y="-10" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">Running</text><text y="18" text-anchor="middle" fill="#8be1d0" font-size="14">实时状态</text></g>
    <path d="M798 190h82" stroke="#55a7ff" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(950 190)"><circle r="68" fill="#17283f" stroke="#31506f" stroke-width="2"/><text y="-10" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">Stop</text><text y="18" text-anchor="middle" fill="#94a9c3" font-size="14">结束进程树</text></g>
    <path d="M950 258v76H730v-76" fill="none" stroke="#55a7ff" stroke-width="3" marker-end="url(#a)"/><text x="840" y="326" text-anchor="middle" fill="#8fc5ff" font-size="14">Restart</text>
    <path d="M950 258v146H510" fill="none" stroke="#617d99" stroke-width="3" marker-end="url(#a)"/><text x="760" y="394" text-anchor="middle" fill="#94a9c3" font-size="14">下一次启动使用当前 config</text>
    <rect x="70" y="438" width="960" height="42" rx="12" fill="#10243b" stroke="#294a69"/><text x="550" y="465" text-anchor="middle" fill="#9fc4e8" font-size="15">运行输出持续写入 ~/.harbor/workspace/&lt;id&gt;/log，停止后仍可查看历史日志</text>
  </g>
</svg>
