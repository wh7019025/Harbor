version: "0.1.2-rc2"
id: demo-ping
name: Demo Ping
description: 演示用的周期性 ping 任务
workdir: $(harbor_taskcfg_dir)/..
command:
  shell: sh
  script: |
    i=0
    while [ "$i" -lt 20 ]; do
      i=$((i + 1))
      echo "demo-ping #$i $(date '+%H:%M:%S')"
      sleep 1
    done
    echo "demo-ping done"
