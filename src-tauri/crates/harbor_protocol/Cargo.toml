[package]
name = "harbor_protocol"
version = "0.0.0"
description = "Cross-platform Harbor API contracts"
authors = ["Harbor"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
serde_yaml = "0.9"
