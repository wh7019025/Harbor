[package]
name = "harbor"
version = "0.0.0"
description = "Harbor desktop console"
authors = ["Harbor"]
edition = "2021"
default-run = "harbor"

[workspace]
members = [
  ".",
  "crates/harbor_common",
  "crates/harbor_core",
  "crates/harbor_protocol",
]
resolver = "2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "harbor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"

[dependencies]
harbor_common = { path = "crates/harbor_common" }
harbor_protocol = { path = "crates/harbor_protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync", "signal"] }
semver = "1"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
harbor_core = { path = "crates/harbor_core" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
