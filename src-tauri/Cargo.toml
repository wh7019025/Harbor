[package]
name = "harbor"
version = "0.1.4"
description = "Harbor desktop console"
authors = ["Harbor"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
parking_lot = "0.12"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt", "time", "net", "sync"] }
semver = "1"
ureq = { version = "2", features = ["json"] }
nvml-wrapper = "0.12.1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
